[flake8]
# E501  line too long  — black handles this, let it win
# W503  line break before binary operator — conflicts with black style
# E203  whitespace before ':' — black uses this in slice notation
max-line-length = 88
extend-ignore = E501,W503,E203
exclude =
    .git,
    __pycache__,
    .venv,
    .venv2,
    *.egg-info,
    build,
    dist,
    # Legacy pre-v3 files kept for backward-compat only
    api/routes.py,
    api/sse.py,
    api/ws.py,
    worker.py,
    extractor.py,
    database.py,
per-file-ignores =
    # __init__.py files are re-export modules — unused imports are intentional
    __init__.py:F401
    # Test files: assert is idiomatic, fixture strings can be long
    tests/*:S101,F401,E402
    # FastAPI routers: Depends() in function default args is the correct pattern (B008)
    # upload.py B005: .lstrip("../") is intentional path sanitisation
    api/v1/routers/files.py:B008,B005
    api/v1/routers/jobs.py:B008,B005
    api/v1/routers/results.py:B008,B005
    api/v1/routers/runs.py:B008,B005
    api/v1/routers/search.py:B008,B005
    api/v1/routers/upload.py:B008,B005
    # String-quoted forward ref for PIL.Image — not a real undefined name
    services/ocr/base.py:F821
    services/ocr/tesseract.py:F821
    # String-quoted forward ref for DatabaseRepository in type hint
    api/v1/routers/files.py:F821
    # cli run_cmd: multiprocessing is a local import inside the function body
    cli/main.py:F401
