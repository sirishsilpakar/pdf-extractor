# ---------------------------------------------------------------------------
# PDF TextExtract — GitLab CI/CD Pipeline
#
# Lint jobs (stage 1, run in parallel):
#   lint:black  — format check
#   lint:isort  — import order check
#   lint:flake8 — style and bug check
#
# Test jobs (stage 2, run after all lint passes):
#   test:unit   — core/, db/, services/
#   test:api    — api/ integration tests
#
# Build jobs (stage 3, run after tests — main/tags only):
#   build:linux   — compiles Linux binary via PyInstaller, uploads to Package Registry
#   build:mac     — compiles macOS binary via PyInstaller, uploads to Package Registry
#   build:windows — compiles Windows .exe via PyInstaller, uploads to Package Registry
#
# ---------------------------------------------------------------------------
# RUNNER TAG CONFIGURATION (self-hosted GitLab instance)
# ---------------------------------------------------------------------------
# This project runs on a self-hosted GitLab instance (gitlab.uni-marburg.de).
# GitLab.com SaaS runner tags (saas-linux-*, saas-macos-*) are NOT available.
#
# You must register GitLab Runner agents on machines of each OS and tag them:
#   Linux   → register runner with tag: linux
#   macOS   → register runner with tag: macos
#   Windows → register runner with tag: windows
#
# To register a runner:
#   1. Go to: Project → Settings → CI/CD → Runners → New project runner
#   2. Add the OS-specific tag (linux / macos / windows)
#   3. On the target machine, install gitlab-runner and run:
#        gitlab-runner register --url https://gitlab.uni-marburg.de --token <TOKEN>
#      Choose executor:
#        Linux   → docker  (image: python:3.11)
#        macOS   → shell   (Homebrew/system Python used directly)
#        Windows → shell   (PowerShell, Python must be installed)
# ---------------------------------------------------------------------------
#
# Triggered on:
#   - MR targeting `dev` or `main`
#   - Direct push to `dev` or `main`
#   - Git tags (vX.Y.Z) — also triggers build stage
# ---------------------------------------------------------------------------

default:
  image: python:3.11-slim

  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .pip-cache/

  before_script:
    - pip install --cache-dir .pip-cache -e ".[dev]" -q

# ---------------------------------------------------------------------------
# Trigger rules
# ---------------------------------------------------------------------------

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
          ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" ||
           $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/   # semver tags trigger build stage

# ---------------------------------------------------------------------------
# Stages
# ---------------------------------------------------------------------------

stages:
  - lint
  - test
  - build

# ---------------------------------------------------------------------------
# Lint — all three run in parallel; all must pass before tests start
# ---------------------------------------------------------------------------

lint:black:
  stage: lint
  script:
    - echo "==> black --check"
    - black --check --diff .
  allow_failure: false

lint:isort:
  stage: lint
  script:
    - echo "==> isort --check"
    - isort --check-only --diff --profile black .
  allow_failure: false

lint:flake8:
  stage: lint
  script:
    - echo "==> flake8"
    - flake8 .
  allow_failure: false

# ---------------------------------------------------------------------------
# Tests — split by layer for clear failure attribution in MR view
# ---------------------------------------------------------------------------

test:unit:
  stage: test
  script:
    - echo "==> pytest core/ db/ services/"
    - pytest tests/core/ tests/db/ tests/services/ -v --tb=short --junit-xml=report-unit.xml
  artifacts:
    when: always
    reports:
      junit: report-unit.xml
    expire_in: 7 days

test:api:
  stage: test
  script:
    - echo "==> pytest api/"
    - pytest tests/api/ -v --tb=short --junit-xml=report-api.xml
  artifacts:
    when: always
    reports:
      junit: report-api.xml
    expire_in: 7 days

# ---------------------------------------------------------------------------
# Build — only on main branch or semver tags, after tests pass
#
# PURPOSE: Compile the Python backend for each target OS using PyInstaller
#          and upload the result to the GitLab Generic Package Registry.
#          The pdf-extractor-ui CI downloads these binaries during packaging.
#
# NOTE: PyInstaller MUST run on the target OS — cross-compilation is not
#       possible. Each job therefore requires a runner of the matching OS.
# ---------------------------------------------------------------------------

build:linux:
  stage: build
  # Use the full image (not slim) — PyInstaller requires binutils/gcc
  image: python:3.11
  tags:
    - linux
  # Separate cache key so pip packages for building don't mix with lint/test
  cache:
    key: "build-linux-$CI_COMMIT_REF_SLUG"
    paths:
      - .pip-cache/
  before_script:
    # Install system build tools needed by some Python C-extensions
    - apt-get update -qy && apt-get install -y --no-install-recommends binutils
    - pip install --cache-dir .pip-cache -e "." pyinstaller -q
  script:
    - echo "==> Building Linux backend binary with PyInstaller..."
    - python build_backend.py
    - echo "==> Verifying output..."
    - test -f dist/pdf-extractor-backend/pdf-extractor-backend
    - echo "==> Build successful. Binary size:"
    - du -sh dist/pdf-extractor-backend/
    # Upload compiled binary to Package Registry for consumption by pdf-extractor-ui
    - |
      PACKAGE_VERSION="${CI_COMMIT_TAG:-dev-${CI_COMMIT_SHORT_SHA}}"
      echo "==> Uploading Linux binary to Package Registry as version: $PACKAGE_VERSION"
      tar -czf pdf-extractor-backend-linux.tar.gz -C dist pdf-extractor-backend
      curl --fail --silent --show-error \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file pdf-extractor-backend-linux.tar.gz \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pdf-extractor-backend/${PACKAGE_VERSION}/pdf-extractor-backend-linux.tar.gz"
      echo "==> Upload complete."
  rules:
    # Only build on main and tags not on dev or MRs (too expensive for every commit)
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  artifacts:
    name: "pdf-extractor-backend-linux-$CI_COMMIT_REF_SLUG"
    expire_in: 7 days
    paths:
      - dist/pdf-extractor-backend/
    when: on_success

build:mac:
  stage: build
  # macOS runner uses the Shell executor — no image: key.
  # The runner executes scripts directly on the macOS host via bash.
  # inherit: default: false prevents the Linux image: python:3.11-slim from
  # leaking into this job (it would be ignored by a Shell executor, but
  # explicitly opting out is cleaner and avoids confusion).
  inherit:
    default: false
  tags:
    - macos
  before_script:
    # Ensure Homebrew Python 3.11 and PyInstaller are available.
    # The macOS runner should have Homebrew installed.
    - python3 --version
    - pip3 install -e "." pyinstaller -q
  script:
    - echo "==> Building macOS backend binary with PyInstaller..."
    - python3 build_backend.py
    - echo "==> Verifying output..."
    - test -f dist/pdf-extractor-backend/pdf-extractor-backend
    - echo "==> Build successful. Binary size:"
    - du -sh dist/pdf-extractor-backend/
    - |
      PACKAGE_VERSION="${CI_COMMIT_TAG:-dev-${CI_COMMIT_SHORT_SHA}}"
      echo "==> Uploading macOS binary to Package Registry as version: $PACKAGE_VERSION"
      tar -czf pdf-extractor-backend-mac.tar.gz -C dist pdf-extractor-backend
      curl --fail --silent --show-error \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file pdf-extractor-backend-mac.tar.gz \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pdf-extractor-backend/${PACKAGE_VERSION}/pdf-extractor-backend-mac.tar.gz"
      echo "==> Upload complete."
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  artifacts:
    name: "pdf-extractor-backend-mac-$CI_COMMIT_REF_SLUG"
    expire_in: 7 days
    paths:
      - dist/pdf-extractor-backend/
    when: on_success

build:windows:
  stage: build
  # Windows runner uses the Shell executor — no image: key.
  # Scripts run natively in PowerShell on the Windows host.
  # Python 3.11 must be installed on the host (or Chocolatey will install it).
  # inherit: default: false prevents the Linux default image from leaking in.
  inherit:
    default: false
  tags:
    - windows
  before_script:
    - Write-Host "==> Installing Python dependencies and PyInstaller..."
    - pip install -e "." pyinstaller
  script:
    - Write-Host "==> Building Windows backend binary with PyInstaller..."
    - python build_backend.py
    - Write-Host "==> Verifying output..."
    - if (!(Test-Path "dist/pdf-extractor-backend/pdf-extractor-backend.exe")) { Write-Error "Binary not found!"; exit 1 }
    - Write-Host "==> Build successful."
    # Upload compiled binary to Package Registry
    - |
      $PACKAGE_VERSION = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG } else { "dev-$env:CI_COMMIT_SHORT_SHA" }
      Write-Host "==> Uploading Windows binary to Package Registry as version: $PACKAGE_VERSION"
      Compress-Archive -Path dist/pdf-extractor-backend -DestinationPath pdf-extractor-backend-windows.zip -Force
      curl.exe --fail --silent --show-error `
               --header "JOB-TOKEN: $env:CI_JOB_TOKEN" `
               --upload-file pdf-extractor-backend-windows.zip `
               "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/pdf-extractor-backend/$PACKAGE_VERSION/pdf-extractor-backend-windows.zip"
      Write-Host "==> Upload complete."
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  artifacts:
    name: "pdf-extractor-backend-windows-$CI_COMMIT_REF_SLUG"
    expire_in: 7 days
    paths:
      - dist/pdf-extractor-backend/
    when: on_success
